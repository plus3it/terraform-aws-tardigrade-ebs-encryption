name: Create GitHub Release

on:
  # Run on demand
  workflow_dispatch:

  # Run on push to default branch when .bumpversion.cfg version is updated
  push:
    branches:
      - main
      - master
    paths:
      - .bumpversion.cfg

jobs:
  release:
    uses: plus3it/actions-workflows/.github/workflows/release.yml@09879910a1e194e51e7407474ecdb0836ed01de1
    secrets:
      release-token: ${{ secrets.GH_RELEASES_TOKEN }}
    with:
      mockstacktest-enable: false
